<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Peter's Perfect Parry seven-hit timing diagram</title>
  <desc id="desc">The correct rhythm is two deliberate guards, four rapid guards, then one delayed final guard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101512"/><stop offset="1" stop-color="#202019"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>
  <text x="70" y="75" fill="#e7e7dc" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">THE QUALIFYING SEVEN-HIT HEADSPIN</text>
  <text x="70" y="118" fill="#9da69b" font-family="Arial, sans-serif" font-size="22">Release the guard button between every contact. Follow the blade, then respect the final pause.</text>
  <path d="M95 325 H1305" stroke="#495048" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#d9e878" stroke="#d9e878" filter="url(#glow)">
      <circle cx="120" cy="325" r="36" fill="#182018" stroke-width="5"/><circle cx="320" cy="325" r="36" fill="#182018" stroke-width="5"/>
      <circle cx="485" cy="325" r="31" fill="#182018" stroke-width="5"/><circle cx="600" cy="325" r="31" fill="#182018" stroke-width="5"/><circle cx="715" cy="325" r="31" fill="#182018" stroke-width="5"/><circle cx="830" cy="325" r="31" fill="#182018" stroke-width="5"/>
      <circle cx="1135" cy="325" r="40" fill="#182018" stroke-width="6"/>
    </g>
    <g fill="#f4f4e8" font-size="30" font-weight="700"><text x="120" y="336">1</text><text x="320" y="336">2</text><text x="485" y="336">3</text><text x="600" y="336">4</text><text x="715" y="336">5</text><text x="830" y="336">6</text><text x="1135" y="336">7</text></g>
    <g fill="#aeb6aa" font-size="18" font-weight="700" letter-spacing="2"><text x="220" y="415">DELIBERATE</text><text x="658" y="415">FOUR-BEAT BURST</text><text x="1135" y="415">WAIT · FINISH</text></g>
    <g fill="#727a71" font-size="18"><text x="120" y="485">read</text><text x="320" y="485">read</text><text x="485" y="485">tap</text><text x="600" y="485">tap</text><text x="715" y="485">tap</text><text x="830" y="485">tap</text><text x="1135" y="485">late tap</text></g>
  </g>
  <path d="M890 305 Q985 230 1080 305" fill="none" stroke="#c06b49" stroke-width="4" stroke-dasharray="9 10"/>
  <text x="985" y="230" fill="#e39a78" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">DO NOT SPAM THROUGH THIS GAP</text>
</svg>
